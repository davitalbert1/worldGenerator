; ==============================================================================
; clima.ini - Arquivo de Configuração Global de Clima e Geração de Mundos
; Altere os valores abaixo para ajustar instantaneamente o comportamento físico!
; ==============================================================================

[temperatura]
; Temperatura média da superfície do planeta em graus Celsius
temperatura_media_global = 15.0

; Temperatura média nas regiões equatoriais (baixas latitudes) em °C
temperatura_equador = 30.0

; Temperatura média nas calotas polares (altas latitudes) em °C
temperatura_polos = -22.0

; Variação sazonal de temperatura ao longo do ano em °C
variacao_sazonal = 12.0

; Taxa de resfriamento vertical com a altitude (Lapse Rate em °C por 1000m normalizados)
taxa_lapse_altitude = 6.5

; Fator de moderação térmica da água do mar (0.0 = sem moderação, 1.0 = isotérmico)
moderacao_termica_oceano = 0.35

[ventos]
; Velocidade média dos ventos planetários globais em km/h
forca_vento_base = 28.0

; Influência da Força de Coriolis e rotação planetária (0.0 a 1.0)
influencia_coriolis = 0.85

; Número de passos de advecção atmosférica na simulação de massas de ar
passos_simulacao = 14

[chuvas]
; Taxa de evaporação sobre os oceanos e corpos d'água (multiplicador)
evaporacao_oceano = 1.05

; Coeficiente de chuva orográfica (chuva gerada quando nuvens encontram montanhas)
taxa_orografica = 0.88

; Precipitação mínima anual (regiões mais secas/desertos) em mm/ano
chuva_minima_mm = 30.0

; Precipitação máxima anual (florestas equatoriais e barlaventos) em mm/ano
chuva_maxima_mm = 3800.0

[mapa]
; Dimensões padrão do grid de simulação
width = 100
height = 100

; Tamanho do hexágono na projeção visual
hex_size = 0.10

; Nível do mar: células com altitude menor ou igual a esse valor são oceanos (0.0 a 1.0)
nivel_do_mar = 0.20

[gerador]
; Quantidade padrão de mapas a serem gerados pelo worldGenerator.exe
num_mapas = 3

[visual]
; Brilho global da imagem final (0.5 = escuro, 1.0 = padrão, 1.5 = claro)
brightness = 1.0

; Ângulo da fonte de luz para o relevo sombreado em graus (0° a 360°)
angulo_luz_graus = 135.0
